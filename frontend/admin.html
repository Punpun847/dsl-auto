<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<title>Admin Test Panel</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  h1 { font-size: 20px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  button { background: #3D2EBF; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { background: #2a1f8c; }
  button.red { background: #c03c3c; }
  button.green { background: #1f9e73; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .tag { display:inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  .pending { background:#fbefd6; color:#d08b1f; }
  .queued  { background:#ddf3ea; color:#0f5c42; }
  .running { background:#edeafe; color:#3d2ebf; }
  .done    { background:#ddf3ea; color:#0f5c42; }
  .failed  { background:#fbe3e3; color:#c03c3c; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding: 8px 10px; border-bottom: 1px solid #eee; text-align:left; }
  th { color: #666; font-weight: 500; }
  pre { background:#1b1b2e; color:#eee; padding:12px; border-radius:8px; font-size:12px; overflow-x:auto; white-space:pre-wrap; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>

<h1>🛠 Admin Test Panel</h1>

<div class="card">
  <b>สร้าง Job ทดสอบ</b>
  <p style="font-size:13px;color:#666;margin:6px 0 12px">กดปุ่มเดียว — สร้าง job + bypass OCR + ส่งเข้า queue</p>
  <div class="row">
    <button onclick="createTestJob()">▶ สร้าง Job ทดสอบ</button>
    <button onclick="loadJobs()" style="background:#555">↻ รีเฟรชรายการ</button>
  </div>
</div>

<div class="card">
  <b>รายการ Jobs</b>
  <table id="jobs-table">
    <thead><tr><th>ID</th><th>Status</th><th>หลักสูตร</th><th>ราคา</th><th>เวลา</th><th>จัดการ</th></tr></thead>
    <tbody id="jobs-body"><tr><td colspan="6" style="color:#aaa">กำลังโหลด…</td></tr></tbody>
  </table>
</div>

<div class="card" id="log-card" style="display:none">
  <b>Log: <span id="log-job-id"></span></b>
  <pre id="log-box" style="margin-top:8px;max-height:300px;overflow-y:auto">รอ log…</pre>
</div>

<script>
const BASE = window.location.origin;
const AUTH = 'Basic ' + btoa('admin:admin1234');

async function api(method, path, body) {
  const opts = { method, headers: { Authorization: AUTH } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(BASE + path, opts);
  return r.json();
}

async function createTestJob() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';

  // 1. สร้าง job ด้วย FormData
  const form = new FormData();
  form.append('nid', '3101234567893');
  form.append('pwd', 'testpassword123');
  form.append('courses', '["anti"]');
  form.append('total_price', '179');
  form.append('total_hours', '6');
  // สร้างไฟล์ dummy เป็น slip
  const blob = new Blob(['test slip'], { type: 'image/jpeg' });
  form.append('slip', blob, 'test-slip.jpg');

  const job = await fetch(BASE + '/jobs/', { method: 'POST', headers: { Authorization: AUTH }, body: form }).then(r => r.json());

  if (!job.id) { alert('สร้าง job ล้มเหลว: ' + JSON.stringify(job)); btn.disabled=false; btn.textContent='▶ สร้าง Job ทดสอบ'; return; }

  // 2. force verify (ข้าม OCR)
  await api('POST', `/admin/jobs/${job.id}/force-verify`);

  btn.disabled = false; btn.textContent = '▶ สร้าง Job ทดสอบ';
  await loadJobs();
  watchLogs(job.id);
}

async function loadJobs() {
  const jobs = await api('GET', '/admin/jobs');
  const tbody = document.getElementById('jobs-body');
  if (!jobs.length) { tbody.innerHTML = '<tr><td colspan="6" style="color:#aaa">ยังไม่มี job</td></tr>'; return; }
  tbody.innerHTML = jobs.map(j => `
    <tr>
      <td style="font-family:monospace;font-size:11px">${j.id.slice(0,8)}…</td>
      <td><span class="tag ${j.status}">${j.status}</span></td>
      <td>${j.courses.join(', ')}</td>
      <td>฿${j.total_price}</td>
      <td style="font-size:11px;color:#888">${new Date(j.created_at).toLocaleTimeString('th')}</td>
      <td>
        <div class="row">
          <button onclick="watchLogs('${j.id}')" style="background:#555;padding:5px 10px;font-size:12px">📋 Log</button>
          <button onclick="forceVerify('${j.id}')" class="green" style="padding:5px 10px;font-size:12px">✓ Force</button>
          <button onclick="deleteJob('${j.id}')" class="red" style="padding:5px 10px;font-size:12px">✕ ลบ</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function forceVerify(id) {
  const r = await api('POST', `/admin/jobs/${id}/force-verify`);
  alert(r.message || JSON.stringify(r));
  loadJobs();
  watchLogs(id);
}

async function deleteJob(id) {
  if (!confirm('ลบ job นี้?')) return;
  await api('DELETE', `/admin/jobs/${id}`);
  loadJobs();
}

let ws;
function watchLogs(jobId) {
  if (ws) ws.close();
  document.getElementById('log-card').style.display = 'block';
  document.getElementById('log-job-id').textContent = jobId.slice(0,8) + '…';
  const box = document.getElementById('log-box');
  box.textContent = 'กำลังเชื่อม WebSocket…\n';

  ws = new WebSocket(`${BASE.replace(/^http/, 'ws')}/ws/jobs/${jobId}`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.event === 'snapshot') {
      box.textContent = d.logs.length ? d.logs.map(l => `[${l.type.toUpperCase()}] ${l.message}`).join('\n') + '\n' : 'รอ log…\n';
    } else if (d.event === 'log') {
      box.textContent += `[${d.type.toUpperCase()}] ${d.message}\n`;
      box.scrollTop = box.scrollHeight;
    }
    loadJobs();
  };
  ws.onclose = () => { box.textContent += '— connection closed —\n'; };
}

loadJobs();
setInterval(loadJobs, 5000);
</script>
</body>
</html>
